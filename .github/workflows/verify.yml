name: verify

# Every example's verify.py must be green AND every check must still bite:
# the mutation suite (harness/mutation.py) plants realistic bugs and requires
# the checks that claim them to go red.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-verify.txt
      - run: python -m harness verify-all
