# GitHub Pages build config.
# Pages serves the product surface only: README (home) + articles/.
# The research corpus (docs/, logs, registers) and the machinery stay
# repo-only — they are corpus, not publications (see CLAUDE.md,
# "Corpus vs surface").
theme: jekyll-theme-primer
title: twotakt
description: "AI turns an architecture description into an executable simulation model. Methodology makes it trustworthy."

# Absolute URLs for link-preview cards (og:image needs them). GitHub Pages
# injects these too; stating them makes the build deterministic.
url: https://gserdyuk.github.io
baseurl: /twotakt

plugins:
  - jekyll-sitemap
exclude:
  - docs/
  - examples/
  - harness/
  - skills/
  - CLAUDE.md
  - INDEX.md
  - TODO.md
  - dev-log.md
  - findings.md
  - LICENSE
  - pyproject.toml
